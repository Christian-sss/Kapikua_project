<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · Kapikua</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #1d2433; }
        main { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; }
        h1 { font-size: 1.4rem; margin: 0 0 16px; }
        label { display: block; font-size: .9rem; margin: 12px 0 4px; }
        input[type=text], input[type=email], input[type=tel], input[type=date], input[type=password] {
            width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #c8cdd6; border-radius: 8px; font-size: 1rem;
        }
        .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; font-size: .9rem; }
        .campo-error { color: #b42318; font-size: .8rem; }
        .error { background: #fde8e7; color: #b42318; padding: 10px; border-radius: 8px; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #1f5eff; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>
<main>
    <h1>Crea tu cuenta Kapikua</h1>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
        <label for="dni">DNI</label>
        <input id="dni" type="text" inputmode="numeric" maxlength="8" th:field="*{dni}" autocomplete="off">
        <span class="campo-error" th:errors="*{dni}"></span>

        <label for="fechaNacimiento">Fecha de nacimiento</label>
        <input id="fechaNacimiento" type="date" th:field="*{fechaNacimiento}">
        <span class="campo-error" th:errors="*{fechaNacimiento}"></span>

        <label for="correo">Correo</label>
        <input id="correo" type="email" th:field="*{correo}" autocomplete="email">
        <span class="campo-error" th:errors="*{correo}"></span>

        <label for="celular">Celular</label>
        <input id="celular" type="tel" inputmode="numeric" maxlength="9" th:field="*{celular}" autocomplete="tel">
        <span class="campo-error" th:errors="*{celular}"></span>

        <label for="nombreNegocio">Nombre de tu negocio (opcional)</label>
        <input id="nombreNegocio" type="text" th:field="*{nombreNegocio}">
        <span class="campo-error" th:errors="*{nombreNegocio}"></span>

        <label for="contrasena">Contraseña</label>
        <input id="contrasena" type="password" th:field="*{contrasena}" autocomplete="new-password">
        <span class="campo-error" th:errors="*{contrasena}"></span>

        <label class="check">
            <input type="checkbox" th:field="*{aceptaTerminos}">
            <span>Acepto los términos del servicio y la política de tratamiento de datos personales.</span>
        </label>

        <button type="submit">Crear cuenta</button>
    </form>
</main>
</body>
</html>
