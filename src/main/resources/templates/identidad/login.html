<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Kapikua</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f7f9; color: #1d2433; }
        main { max-width: 420px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; }
        h1 { font-size: 1.4rem; margin: 0 0 16px; }
        label { display: block; font-size: .9rem; margin: 12px 0 4px; }
        input[type=text], input[type=password] {
            width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #c8cdd6; border-radius: 8px; font-size: 1rem;
        }
        .error { background: #fde8e7; color: #b42318; padding: 10px; border-radius: 8px; }
        .aviso { background: #e7f0fd; color: #1849a9; padding: 10px; border-radius: 8px; }
        button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #1f5eff; color: #fff; font-size: 1rem; }
        p.pie { text-align: center; font-size: .9rem; margin-top: 16px; }
    </style>
</head>
<body>
<main>
    <h1>Ingresa a Kapikua</h1>

    <p class="aviso" th:if="${aviso}" th:text="${aviso}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/login}" method="post">
        <label for="usuario">Correo o DNI</label>
        <input id="usuario" name="usuario" type="text" th:value="${usuario}" autocomplete="username" required>

        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>

        <button type="submit">Ingresar</button>
    </form>

    <p class="pie">¿No tienes cuenta? <a th:href="@{/registro}">Crea tu cuenta</a></p>
</main>
</body>
</html>
