<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Pago anticipado')}"></head>
<body>
<header th:replace="~{fragmentos :: barra('prestamo')}"></header>

<main class="app-main" id="contenido">
    <div class="container">
        <div class="op-card">
            <div class="page-head">
                <a class="back-link" th:href="@{/credito/prestamo}"><svg th:replace="~{fragmentos :: icono('i-back')}"></svg>Mi préstamo</a>
                <h1>Pagar por adelantado</h1>
                <p>Sin penalidad: pagas solo capital y te ahorras los intereses de las semanas que adelantas.</p>
            </div>

            <form class="card stack" th:action="@{/credito/prestamo/anticipado}" method="post">
                <input type="hidden" name="referencia" th:value="${v.referencia()}">
                <div class="notice danger" th:if="${error}"><svg th:replace="~{fragmentos :: icono('i-x-circle')}"></svg><div th:text="${error}">Error</div></div>
                <div class="notice warning" th:if="${v.hayVencidas()}"><svg th:replace="~{fragmentos :: icono('i-alert')}"></svg><div>Tienes cuotas vencidas: págalas primero.</div></div>

                <div class="figures" style="grid-template-columns: 1fr 1fr">
                    <div class="figure hl"><small>Capital pendiente</small><b th:text="${v.capitalPendiente()}">S/ 0.00</b></div>
                    <div class="figure"><small>Cuotas por vencer</small><b th:text="${v.cuotasPendientes()}">0</b></div>
                </div>

                <div class="choice-grid">
                    <label class="choice"><input type="radio" name="modalidad" value="TOTAL" checked>
                        <span><b>Total</b><small th:text="'Pagar todo: ' + ${v.capitalPendiente()}"></small></span></label>
                    <label class="choice"><input type="radio" name="modalidad" value="REDUCIR_CUOTA">
                        <span><b>Parcial · reducir la cuota</b><small>Mismas semanas, cuotas más bajas</small></span></label>
                    <label class="choice"><input type="radio" name="modalidad" value="REDUCIR_PLAZO">
                        <span><b>Parcial · reducir el plazo</b><small>Misma cuota, terminas antes</small></span></label>
                </div>

                <div class="field">
                    <label for="monto">Monto del pago parcial</label>
                    <div class="input-group"><span class="prefix">S/</span>
                        <input class="input" id="monto" name="monto" type="number" step="0.01" min="0.01" placeholder="0.00"></div>
                    <span class="hint">Solo si eliges un pago parcial.</span>
                </div>

                <p class="notice info"><svg th:replace="~{fragmentos :: icono('i-check-circle')}"></svg><span class="small">Sin penalidad ni comisiones.</span></p>

                <div class="btn-row">
                    <a class="btn btn-outline" th:href="@{/credito/prestamo}">Cancelar</a>
                    <button class="btn btn-primary btn-lg" type="submit">Confirmar pago</button>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
