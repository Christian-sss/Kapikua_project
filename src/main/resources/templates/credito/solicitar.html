<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Solicitar crédito')}"></head>
<body>
<header th:replace="~{fragmentos :: barra('credito')}"></header>

<main class="app-main" id="contenido">
    <div class="container container-md">
        <div class="page-head">
            <a class="back-link" th:href="@{/credito/simular}"><svg th:replace="~{fragmentos :: icono('i-back')}"></svg>Simulador</a>
            <h1>Solicitar crédito</h1>
            <p>KAPIKUA evalúa tu solicitud con los datos de tu billetera y te recomienda condiciones. Financiera Ayni Sur decide y te desembolsa.</p>
        </div>

        <form class="card" th:action="@{/credito/solicitar}" method="post"
              th:with="minimo=${opciones != null ? opciones.cuotasMinimas() : 4},
                       maximo=${opciones != null ? opciones.cuotasMaximas() : 24},
                       elegido=${cuotas != null ? cuotas : (opciones != null ? opciones.cuotasMaximas() : 8)}">
            <ol th:replace="~{fragmentos :: pasos('Solicitud', 'Recomendación', 'Oferta', 1)}"></ol>

            <div class="stack">
                <h2 class="card-title">¿Cuánto necesitas?</h2>

                <div class="notice danger" th:if="${error}">
                    <svg th:replace="~{fragmentos :: icono('i-x-circle')}"></svg>
                    <div th:text="${error}">Error</div>
                </div>

                <div class="form-row">
                    <div class="field">
                        <label for="monto">Monto</label>
                        <div class="input-group"><span class="prefix">S/</span>
                            <input class="input input-amount" id="monto" name="monto" type="number" step="0.01" min="1" th:value="${monto}" required></div>
                        <span class="hint" th:if="${opciones}" th:text="'Máximo ' + ${opciones.montoMaximo()} + '.'"></span>
                    </div>
                    <div class="field">
                        <label for="cuotas">Cuotas semanales</label>
                        <select class="input" id="cuotas" name="cuotas" required>
                            <option th:each="k : ${#numbers.sequence(minimo, maximo)}" th:value="${k}" th:text="${k}"
                                    th:selected="${k == elegido}"></option>
                        </select>
                        <span class="hint" th:if="${opciones}" th:text="'Nivel ' + ${opciones.nivel()} + ': de ' + ${minimo} + ' a ' + ${maximo} + ' cuotas.'"></span>
                    </div>
                </div>

                <div class="field">
                    <label for="destino">Destino del crédito</label>
                    <select class="input" id="destino" name="destino" required>
                        <option th:each="d : ${destinos}" th:value="${d}"
                                th:text="${#strings.replace(#strings.capitalize(#strings.toLowerCase(d)), '_', ' ')}"></option>
                    </select>
                </div>

                <label class="check">
                    <input type="checkbox" name="autorizaDatos" value="true">
                    <span><b>Evaluar y enviar mis datos</b><small>Autorizo que Kapikua evalúe mi solicitud con los datos de mi billetera y los envíe a Financiera Ayni Sur, la entidad que decide y otorga el crédito.</small></span>
                </label>

                <button class="btn btn-primary btn-lg btn-block" type="submit">
                    <svg th:replace="~{fragmentos :: icono('i-bolt')}"></svg>Evaluar mi solicitud</button>
            </div>
        </form>
    </div>
</main>

</body>
</html>
