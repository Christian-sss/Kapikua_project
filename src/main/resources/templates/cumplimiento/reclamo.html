<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Reclamo')}"></head>
<body>
<header th:replace="~{fragmentos :: barra('reclamos')}"></header>

<main class="app-main" id="contenido">
    <div class="container container-md stack-lg">
        <div class="page-head page-head-row" style="margin-bottom:0">
            <div class="stack-sm">
                <a class="back-link" th:href="@{/reclamos}"><svg th:replace="~{fragmentos :: icono('i-back')}"></svg>Mis reclamos</a>
                <h1 th:text="'Reclamo ' + ${r.codigo()}">Reclamo</h1>
            </div>
            <span class="badge" th:classappend="${r.estado().name() == 'ATENDIDO'} ? 'success' : 'warning'"
                  th:text="${r.estado().name() == 'ATENDIDO'} ? 'RESPONDIDO' : 'EN ATENCIÓN'"></span>
        </div>

        <section class="card receipt" th:if="${registrado}">
            <div class="receipt-ico"><svg th:replace="~{fragmentos :: icono('i-file')}"></svg></div>
            <h2>Recibimos tu reclamo</h2>
            <p class="muted">Guarda tu código; te responderemos a más tardar en la fecha límite.</p>
        </section>

        <section class="card">
            <dl class="kv">
                <div><dt>Código</dt><dd th:text="${r.codigo()}"></dd></div>
                <div><dt>Motivo</dt><dd th:text="${r.motivo().descripcion()}"></dd></div>
                <div><dt>Registrado</dt><dd th:text="${#temporals.format(r.fechaRegistro(), 'dd/MM/yyyy HH:mm')}"></dd></div>
                <div class="total"><dt>Fecha límite de respuesta</dt><dd th:text="${#temporals.format(r.fechaLimite(), 'dd/MM/yyyy')}"></dd></div>
            </dl>
            <p class="small" style="margin-top: var(--space-4)"><b>Tu reclamo:</b></p>
            <p class="small texto-largo" th:text="${r.detalle()}"></p>
        </section>

        <div class="notice warning" th:if="${r.prorroga()}">
            <svg th:replace="~{fragmentos :: icono('i-clock')}"></svg>
            <div class="small"><b>Ampliamos el plazo de respuesta</b>
                Hasta el <span th:text="${#temporals.format(r.fechaLimite(), 'dd/MM/yyyy')}"></span>.
                <span class="texto-largo" style="display:block;margin-top:4px" th:text="${r.prorroga()}"></span></div>
        </div>

        <div class="notice info" th:if="${r.respuesta()}">
            <svg th:replace="~{fragmentos :: icono('i-message')}"></svg>
            <div class="small"><b>Respuesta de KAPIKUA</b>
                <span class="muted" th:text="${#temporals.format(r.fechaRespuesta(), 'dd/MM/yyyy HH:mm')}"></span>
                <span class="texto-largo" style="display:block;margin-top:4px" th:text="${r.respuesta()}"></span></div>
        </div>
    </div>
</main>

</body>
</html>
