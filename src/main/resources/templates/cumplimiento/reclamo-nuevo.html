<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Nuevo reclamo')}"></head>
<body>
<main>
    <div th:replace="~{fragmentos :: barra}"></div>
    <section class="tarjeta">
        <h1>Nuevo reclamo</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form th:action="@{/reclamos}" method="post">
            <label for="motivo">Motivo</label>
            <select id="motivo" name="motivo" required>
                <option th:each="m : ${motivos}" th:value="${m.name()}" th:text="${m.descripcion()}"
                        th:selected="${m.name() == motivo}"></option>
            </select>
            <label for="operacion">N.° de operación (opcional)</label>
            <input type="number" id="operacion" name="operacion" min="1" th:value="${operacion}" inputmode="numeric">
            <label for="detalle">Describe el problema</label>
            <textarea id="detalle" name="detalle" maxlength="450" minlength="10" required th:text="${detalle}"></textarea>
            <p class="nota">Entre 10 y 450 caracteres. Te daremos un código y la fecha límite de respuesta.</p>
            <button type="submit" class="principal">Registrar reclamo</button>
        </form>
    </section>
</main>
</body>
</html>
