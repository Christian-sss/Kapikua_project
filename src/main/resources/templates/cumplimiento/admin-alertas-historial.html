<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Historial de revisiones')}"></head>
<body>
<header th:replace="~{fragmentos :: barraAdmin('alertas')}"></header>

<main class="app-main" id="contenido">
    <div class="container">
        <div class="page-head">
            <a class="back-link" th:href="@{/admin/alertas}"><svg th:replace="~{fragmentos :: icono('i-back')}"></svg>Alertas</a>
            <h1>Historial de revisiones</h1>
            <p>Alertas ya revisadas, de la más reciente a la más antigua.</p>
        </div>

        <section class="card card-flush" aria-labelledby="t-hist">
            <div class="card-head"><h2 id="t-hist">Revisadas</h2>
                <span class="muted small" th:text="${#lists.size(revisadas)} + (${#lists.size(revisadas) == 1} ? ' alerta' : ' alertas')"></span></div>
            <div class="table-wrap" style="margin-top: var(--space-4)" th:unless="${#lists.isEmpty(revisadas)}">
                <table class="table">
                    <thead><tr><th>Fecha</th><th>Regla</th><th>Cliente</th><th>DNI</th><th>Decisión</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="a : ${revisadas}">
                        <td th:text="${#temporals.format(a.fecha(), 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${a.regla().nombre()}"></td>
                        <td th:text="${a.cliente().nombre()}"></td>
                        <td th:text="${a.cliente().dniEnmascarado()}"></td>
                        <td><span class="badge" th:classappend="${a.estado().name() == 'ESCALADA'} ? 'danger' : 'success'"
                                  th:text="${a.estado().name() == 'ESCALADA'} ? 'ESCALADA' : 'DESCARTADA'"></span></td>
                        <td><a class="btn btn-sm btn-outline" th:href="@{/admin/alertas/{id}(id=${a.id()})}">Ver</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <p class="xs muted" style="padding: 0 var(--space-4) var(--space-4)" th:if="${#lists.size(revisadas) >= limite}"
               th:text="'Se muestran las últimas ' + ${limite} + ' revisiones.'"></p>
            <div class="empty" th:if="${#lists.isEmpty(revisadas)}">
                <span class="ico-box"><svg th:replace="~{fragmentos :: icono('i-history')}"></svg></span>
                <b>Aún no hay alertas revisadas</b>
            </div>
        </section>
    </div>
</main>

</body>
</html>
