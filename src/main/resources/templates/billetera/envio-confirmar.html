<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Confirmar')}"></head>
<body>
<header th:replace="~{fragmentos :: barra('billetera')}"></header>

<main class="app-main" id="contenido">
    <div class="container">
        <div class="op-card">
            <div class="page-head">
                <a class="back-link" th:href="@{${modo.ruta}}"><svg th:replace="~{fragmentos :: icono('i-back')}"></svg>Cambiar datos</a>
                <h1 th:text="'Confirma: ' + ${modo.titulo.toLowerCase()}">Confirma</h1>
            </div>

            <form class="card" th:action="@{__${modo.ruta}__/confirmar}" th:object="${form}" method="post">
                <input type="hidden" th:field="*{celular}">
                <input type="hidden" th:field="*{monto}">
                <input type="hidden" th:field="*{referencia}">
                <ol th:replace="~{fragmentos :: pasos('Datos', ${modo.pideCodigo} ? 'Código' : 'Confirmación', 'Comprobante', 2)}"></ol>

                <div class="stack" th:attr="data-otp-box=${modo.pideCodigo} ? '' : null, data-codigo=${modo.pideCodigo} ? ${vista.codigoMostrado()} : null">
                    <h2 class="card-title" th:text="${modo.pideCodigo} ? 'Confirma con tu código' : 'Revisa y confirma'">Confirma</h2>
                    <div class="op-summary">
                        <small>Envías a <b th:text="${vista.destinatario()}">Destinatario</b></small>
                        <strong th:text="${vista.monto()}">S/ 0.00</strong>
                    </div>
                    <dl class="kv">
                        <div><dt>Celular</dt><dd th:text="${vista.celularEnmascarado()}"></dd></div>
                    </dl>

                    <th:block th:if="${modo.pideCodigo}">
                        <p class="muted small" style="text-align:center">Te mostramos un código de 6 dígitos en pantalla. Vence en 5 minutos y sirve una sola vez.</p>
                        <input type="hidden" th:field="*{codigo}">
                        <th:block th:replace="~{fragmentos :: otp(${vista.codigoMostrado()}, null)}"></th:block>
                        <p class="otp-hint">¿Venció o lo escribiste mal?
                            <button class="link-btn" type="submit" form="pedir-codigo">Pedir otro código</button></p>
                    </th:block>

                    <div class="btn-row">
                        <a class="btn btn-outline" th:href="@{/billetera}">Cancelar</a>
                        <button class="btn btn-primary btn-lg" type="submit">
                            <svg th:replace="~{fragmentos :: icono(${modo.pideCodigo} ? 'i-send' : 'i-store')}"></svg>
                            <span th:text="${modo.pideCodigo} ? 'Transferir' : 'Pagar'">Confirmar</span>
                        </button>
                    </div>
                </div>
            </form>

            <!-- CU-05, flujo 5a: vuelve a preparar la operación con los mismos datos y genera un código nuevo -->
            <form th:if="${modo.pideCodigo}" id="pedir-codigo" th:action="@{${modo.ruta}}" method="post" hidden>
                <input type="hidden" name="celular" th:value="${form.celular}">
                <input type="hidden" name="monto" th:value="${form.monto}">
                <input type="hidden" name="referencia" th:value="${form.referencia}">
            </form>
        </div>
    </div>
</main>

</body>
</html>
