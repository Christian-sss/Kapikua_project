<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Confirmar')}"></head>
<body>
<main>
    <div th:replace="~{fragmentos :: barra}"></div>
    <section class="tarjeta">
        <!-- Paso 2 de 3: confirmar a quién se envía -->
        <h1 th:text="'Confirma: ' + ${modo.titulo.toLowerCase()}">Confirma</h1>
        <div class="fila"><span>Para</span><strong th:text="${vista.destinatario()}"></strong></div>
        <div class="fila"><span>Celular</span><span th:text="${vista.celularEnmascarado()}"></span></div>
        <div class="fila"><span>Monto</span><strong th:text="${vista.monto()}"></strong></div>

        <form th:action="@{__${modo.ruta}__/confirmar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{celular}">
            <input type="hidden" th:field="*{monto}">
            <input type="hidden" th:field="*{referencia}">

            <th:block th:if="${modo.pideCodigo}">
                <!-- RNF-04. En la v1 no hay SMS: el código se muestra aquí. -->
                <p class="aviso" style="margin-top:16px">
                    Tu código de un solo uso (vence en 5 minutos):
                    <span class="codigo" style="display:block" th:text="${vista.codigoMostrado()}"></span>
                    <span class="nota">En producción este código llegaría por SMS.</span>
                </p>
                <label for="codigo">Ingresa el código</label>
                <input id="codigo" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
                       th:field="*{codigo}" required>
            </th:block>

            <button type="submit" class="principal" th:text="${modo.pideCodigo} ? 'Transferir' : 'Pagar'">Confirmar</button>
        </form>
    </section>
</main>
</body>
</html>
