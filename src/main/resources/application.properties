spring.application.name=Kapikua_api

server.port=${PORT:8080}

spring.datasource.url=${KAPIKUA_DB_URL:jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5432}/${PGDATABASE:kapikua_dev}}
spring.datasource.username=${KAPIKUA_DB_USUARIO:${PGUSER:}}
spring.datasource.password=${KAPIKUA_DB_CLAVE:${PGPASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

kapikua.terminos.version=v1

kapikua.jwt.secreto=${KAPIKUA_JWT_SECRETO:}
kapikua.sesion.minutos=15
server.forward-headers-strategy=framework
kapikua.sesion.cookie-segura=${KAPIKUA_COOKIE_SEGURA:false}

spring.threads.virtual.enabled=true
spring.jpa.properties.hibernate.order_updates=true

kapikua.codigo.minutos=5

kapikua.sse.minutos-conexion=5
kapikua.sse.latido-ms=25000
