spring.application.name=Kapikua_api

# Base de datos. En Railway se definen las variables de entorno (la base de pruebas es compartida
# por el equipo); los valores por defecto son solo para la base local de desarrollo.
# KAPIKUA_DB_URL va en formato JDBC: jdbc:postgresql://<host>:<puerto>/<base>
spring.datasource.url=${KAPIKUA_DB_URL:jdbc:postgresql://localhost:5432/kapikua_db}
spring.datasource.username=${KAPIKUA_DB_USUARIO:chris}
spring.datasource.password=${KAPIKUA_DB_CLAVE:1234}

# La base se crea con el script SQL v6; Hibernate solo verifica que coincida (RES-05)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Version del texto de terminos que acepta el cliente (RN-07); igual a la del script de pruebas v6
kapikua.terminos.version=v1

# Sesion (RNF-03): JWT en cookie HttpOnly que vence tras 15 minutos sin actividad.
# En Railway definir KAPIKUA_JWT_SECRETO (32 caracteres o mas); sin el, se usa uno aleatorio por arranque.
kapikua.jwt.secreto=${KAPIKUA_JWT_SECRETO:}
kapikua.sesion.minutos=15

# Concurrencia (SAD 2.4): hilos virtuales y actualizaciones ordenadas por id para evitar bloqueos mutuos
spring.threads.virtual.enabled=true
spring.jpa.properties.hibernate.order_updates=true

# Codigo de un solo uso (RNF-04)
kapikua.codigo.minutos=5

# Tiempo real (RNF-17): cada conexion SSE dura unos minutos y el navegador se reconecta solo;
# latido cada 25 s para que el proxy de Railway no la corte
kapikua.sse.minutos-conexion=5
kapikua.sse.latido-ms=25000
